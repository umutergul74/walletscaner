name: walletscaner

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: .
    dockerfile: docker/worker.Dockerfile
  image: walletscaner-worker:local
  env_file:
    - .env.server
  environment:
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    REDIS_URL: redis://redis:6379
    ENABLE_LIVE_EXECUTION: "false"
  volumes:
    - ./reports:/app/reports
    - ./logs:/app/logs
  init: true
  pids_limit: 128
  cpu_shares: 128
  logging: *json-logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=30
      - -c
      - autovacuum_max_workers=1
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_temp_files=1024
      - -c
      - log_lock_waits=on
    mem_limit: 256m
    cpus: "0.21"
    cpu_shares: 256
    pids_limit: 128
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    mem_limit: 48m
    cpus: "0.04"
    cpu_shares: 64
    pids_limit: 64
    logging: *json-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    mem_limit: 128m
    cpus: "0.08"
    depends_on:
      postgres:
        condition: service_healthy

  solana-ingestion:
    <<: *app
    image: ${WALLETSCANER_INGEST_IMAGE:-walletscaner-worker:local}
    command: ["node", "--import", "tsx", "apps/worker/src/watch-solana.ts"]
    restart: unless-stopped
    mem_limit: 160m
    # A 15% hard CFS ceiling caused the high-volume discovery socket to be
    # throttled during short bursts and fall behind without increasing the
    # service's average CPU use. The measured 20% ceiling preserves host
    # headroom while allowing those bursts to drain in real time.
    cpus: "0.20"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: walletscaner-api:local
    profiles: ["ui"]
    env_file:
      - .env.server
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379
      REPOSITORY_MODE: postgres
      API_PORT: "4010"
      ENABLE_LIVE_EXECUTION: "false"
    ports:
      - "${API_PORT:-4010}:4010"
    init: true
    mem_limit: 80m
    cpus: "0.06"
    cpu_shares: 128
    pids_limit: 128
    logging: *json-logging
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:4010}
    image: walletscaner-web:local
    profiles: ["ui"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:4010}
    ports:
      - "${WEB_PORT:-3010}:3010"
    init: true
    mem_limit: 96m
    cpus: "0.05"
    cpu_shares: 128
    pids_limit: 128
    logging: *json-logging
    restart: unless-stopped
    depends_on:
      - api

  evidence-sampler:
    <<: *app
    image: ${WALLETSCANER_INGEST_IMAGE:-walletscaner-worker:local}
    profiles: ["research"]
    command: ["node", "--import", "tsx", "apps/worker/src/sample-evidence-prices.ts"]
    restart: unless-stopped
    mem_limit: 80m
    cpus: "0.05"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  wallet-alpha:
    <<: *app
    image: ${WALLETSCANER_RESEARCH_IMAGE:-walletscaner-worker:local}
    profiles: ["research", "paper"]
    command: ["node", "--import", "tsx", "scripts/research/wallet-alpha-worker.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379
      ENABLE_LIVE_EXECUTION: "false"
      NODE_OPTIONS: "--max-old-space-size=${WALLET_ALPHA_NODE_HEAP_MB:-112}"
      PGOPTIONS: "-c max_parallel_workers_per_gather=0"
    mem_limit: 160m
    cpus: "0.10"
    depends_on:
      migrate:
        condition: service_completed_successfully

  paper-alert:
    <<: *app
    image: ${WALLETSCANER_SIGNAL_IMAGE:-walletscaner-worker:local}
    profiles: ["paper"]
    command: ["node", "--import", "tsx", "apps/worker/src/process-wallet-alpha-outbox.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379
      ENABLE_LIVE_EXECUTION: "false"
      PAPER_STRATEGY_VERSION: "${PAPER_STRATEGY_VERSION:-qualified-pool-paper-v3-strict-flow}"
      NODE_OPTIONS: "--max-old-space-size=40"
    mem_limit: 80m
    cpus: "0.02"
    cpu_shares: 32
    pids_limit: 64
    depends_on:
      migrate:
        condition: service_completed_successfully

  telegram-notifier:
    <<: *app
    image: ${WALLETSCANER_SIGNAL_IMAGE:-walletscaner-worker:local}
    profiles: ["notifications"]
    command: ["node", "--import", "tsx", "apps/worker/src/telegram-notifier.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379
      ENABLE_LIVE_EXECUTION: "false"
      NODE_OPTIONS: "--max-old-space-size=40"
    mem_limit: 80m
    cpus: "0.02"
    cpu_shares: 32
    pids_limit: 64
    depends_on:
      migrate:
        condition: service_completed_successfully

  data-maintenance:
    <<: *app
    image: ${WALLETSCANER_OPERATIONS_IMAGE:-walletscaner-worker:local}
    profiles: ["operations"]
    command:
      - sh
      - -lc
      - |
        sleep "$${MAINTENANCE_INITIAL_DELAY_SECONDS:-300}"
        while true; do
          NODE_OPTIONS="--max-old-space-size=$${MAINTENANCE_NODE_HEAP_MB:-32}" \
            node --import tsx scripts/maintenance/prune-operational-data.ts
          sleep "$${MAINTENANCE_INTERVAL_SECONDS:-3600}"
        done
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.04"
    depends_on:
      migrate:
        condition: service_completed_successfully

  operations-monitor:
    <<: *app
    image: ${WALLETSCANER_OPERATIONS_IMAGE:-walletscaner-worker:local}
    profiles: ["operations"]
    command:
      - sh
      - -lc
      - |
        while true; do
          NODE_OPTIONS="--max-old-space-size=$${OPERATIONS_MONITOR_NODE_HEAP_MB:-32}" \
            node --import tsx scripts/maintenance/check-operational-health.ts
          sleep "$${OPERATIONS_MONITOR_INTERVAL_SECONDS:-60}"
        done
    restart: unless-stopped
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./backups:/app/backups:ro
    mem_limit: 64m
    cpus: "0.03"
    depends_on:
      migrate:
        condition: service_completed_successfully

  archive-writer: &archive-writer
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: ${WALLETSCANER_OPERATIONS_IMAGE:-walletscaner-worker:local}
    profiles: ["archive"]
    command: ["node", "--import", "tsx", "scripts/archive/archive-writer.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      ENABLE_LIVE_EXECUTION: "false"
      ARCHIVE_ENABLED: "${ARCHIVE_ENABLED:-false}"
      ARCHIVE_PROVIDER: "${ARCHIVE_PROVIDER:-s3-compatible}"
      ARCHIVE_ENDPOINT: "${ARCHIVE_ENDPOINT:-https://s3.eu-central-003.backblazeb2.com}"
      ARCHIVE_REGION: "${ARCHIVE_REGION:-eu-central-003}"
      ARCHIVE_BUCKET: "${ARCHIVE_BUCKET:-walletscaner}"
      ARCHIVE_PREFIX: "${ARCHIVE_PREFIX:-walletscanner-prod}"
      ARCHIVE_WRITE_ACCESS_KEY_ID: "${ARCHIVE_WRITE_ACCESS_KEY_ID:-}"
      ARCHIVE_WRITE_SECRET_ACCESS_KEY: "${ARCHIVE_WRITE_SECRET_ACCESS_KEY:-}"
      ARCHIVE_REQUEST_TIMEOUT_MS: "${ARCHIVE_REQUEST_TIMEOUT_MS:-600000}"
      ARCHIVE_MAX_ATTEMPTS: "${ARCHIVE_MAX_ATTEMPTS:-5}"
      ARCHIVE_DRY_RUN: "${ARCHIVE_DRY_RUN:-true}"
      ARCHIVE_STAGING_DIR: /app/archive-staging
      ARCHIVE_SETTLE_HOURS: "${ARCHIVE_SETTLE_HOURS:-6}"
      ARCHIVE_WALLET_EVIDENCE_SETTLE_HOURS: "${ARCHIVE_WALLET_EVIDENCE_SETTLE_HOURS:-72}"
      ARCHIVE_LEASE_SECONDS: "${ARCHIVE_LEASE_SECONDS:-1800}"
      ARCHIVE_RETRY_SECONDS: "${ARCHIVE_RETRY_SECONDS:-300}"
      ARCHIVE_MAX_SEGMENTS_PER_RUN: "${ARCHIVE_MAX_SEGMENTS_PER_RUN:-1}"
      ARCHIVE_MAX_RUN_SECONDS: "${ARCHIVE_MAX_RUN_SECONDS:-7200}"
      ARCHIVE_MIN_FREE_BYTES: "${ARCHIVE_MIN_FREE_BYTES:-1073741824}"
      ARCHIVE_OBJECT_LOCK_MIN_REMAINING_DAYS: "${ARCHIVE_OBJECT_LOCK_MIN_REMAINING_DAYS:-7}"
      ARCHIVE_OBJECT_LOCK_EVIDENCE_MODE: "${ARCHIVE_OBJECT_LOCK_EVIDENCE_MODE:-api-verified}"
      ARCHIVE_OBJECT_LOCK_DEFAULT_MODE: "${ARCHIVE_OBJECT_LOCK_DEFAULT_MODE:-GOVERNANCE}"
      ARCHIVE_OBJECT_LOCK_DEFAULT_DAYS: "${ARCHIVE_OBJECT_LOCK_DEFAULT_DAYS:-30}"
      ARCHIVE_ZSTD_COMMAND: zstd
      ARCHIVE_WRITER_INTERVAL_SECONDS: "${ARCHIVE_WRITER_INTERVAL_SECONDS:-3600}"
      ARCHIVE_SCHEDULER_FAILURE_DELAY_SECONDS: "${ARCHIVE_SCHEDULER_FAILURE_DELAY_SECONDS:-900}"
      NODE_OPTIONS: "--max-old-space-size=48"
      PGOPTIONS: "-c max_parallel_workers_per_gather=0"
    volumes:
      - ./archive-staging/writer:/app/archive-staging
    init: true
    mem_limit: 128m
    cpus: "0.04"
    cpu_shares: 32
    pids_limit: 64
    logging: *json-logging
    depends_on:
      migrate:
        condition: service_completed_successfully

  archive-verifier: &archive-verifier
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: ${WALLETSCANER_OPERATIONS_IMAGE:-walletscaner-worker:local}
    profiles: ["archive"]
    command: ["node", "--import", "tsx", "scripts/archive/archive-verifier.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      ENABLE_LIVE_EXECUTION: "false"
      ARCHIVE_ENABLED: "${ARCHIVE_ENABLED:-false}"
      ARCHIVE_PROVIDER: "${ARCHIVE_PROVIDER:-s3-compatible}"
      ARCHIVE_ENDPOINT: "${ARCHIVE_ENDPOINT:-https://s3.eu-central-003.backblazeb2.com}"
      ARCHIVE_REGION: "${ARCHIVE_REGION:-eu-central-003}"
      ARCHIVE_BUCKET: "${ARCHIVE_BUCKET:-walletscaner}"
      ARCHIVE_PREFIX: "${ARCHIVE_PREFIX:-walletscanner-prod}"
      ARCHIVE_READ_ACCESS_KEY_ID: "${ARCHIVE_READ_ACCESS_KEY_ID:-}"
      ARCHIVE_READ_SECRET_ACCESS_KEY: "${ARCHIVE_READ_SECRET_ACCESS_KEY:-}"
      ARCHIVE_REQUEST_TIMEOUT_MS: "${ARCHIVE_REQUEST_TIMEOUT_MS:-600000}"
      ARCHIVE_MAX_ATTEMPTS: "${ARCHIVE_MAX_ATTEMPTS:-5}"
      ARCHIVE_DRY_RUN: "${ARCHIVE_DRY_RUN:-true}"
      ARCHIVE_STAGING_DIR: /app/archive-staging
      ARCHIVE_SETTLE_HOURS: "${ARCHIVE_SETTLE_HOURS:-6}"
      ARCHIVE_WALLET_EVIDENCE_SETTLE_HOURS: "${ARCHIVE_WALLET_EVIDENCE_SETTLE_HOURS:-72}"
      ARCHIVE_LEASE_SECONDS: "${ARCHIVE_LEASE_SECONDS:-1800}"
      ARCHIVE_RETRY_SECONDS: "${ARCHIVE_RETRY_SECONDS:-300}"
      ARCHIVE_MAX_SEGMENTS_PER_RUN: "${ARCHIVE_MAX_SEGMENTS_PER_RUN:-1}"
      ARCHIVE_MAX_RUN_SECONDS: "${ARCHIVE_MAX_RUN_SECONDS:-7200}"
      ARCHIVE_MIN_FREE_BYTES: "${ARCHIVE_MIN_FREE_BYTES:-1073741824}"
      ARCHIVE_OBJECT_LOCK_MIN_REMAINING_DAYS: "${ARCHIVE_OBJECT_LOCK_MIN_REMAINING_DAYS:-7}"
      ARCHIVE_OBJECT_LOCK_EVIDENCE_MODE: "${ARCHIVE_OBJECT_LOCK_EVIDENCE_MODE:-api-verified}"
      ARCHIVE_OBJECT_LOCK_DEFAULT_MODE: "${ARCHIVE_OBJECT_LOCK_DEFAULT_MODE:-GOVERNANCE}"
      ARCHIVE_OBJECT_LOCK_DEFAULT_DAYS: "${ARCHIVE_OBJECT_LOCK_DEFAULT_DAYS:-30}"
      ARCHIVE_ZSTD_COMMAND: zstd
      ARCHIVE_VERIFIER_INITIAL_DELAY_SECONDS: "${ARCHIVE_VERIFIER_INITIAL_DELAY_SECONDS:-300}"
      ARCHIVE_VERIFIER_INTERVAL_SECONDS: "${ARCHIVE_VERIFIER_INTERVAL_SECONDS:-900}"
      ARCHIVE_SCHEDULER_FAILURE_DELAY_SECONDS: "${ARCHIVE_SCHEDULER_FAILURE_DELAY_SECONDS:-900}"
      NODE_OPTIONS: "--max-old-space-size=48"
      PGOPTIONS: "-c max_parallel_workers_per_gather=0"
    volumes:
      - ./archive-staging/verifier:/app/archive-staging
    init: true
    mem_limit: 128m
    cpus: "0.04"
    cpu_shares: 32
    pids_limit: 64
    logging: *json-logging
    depends_on:
      migrate:
        condition: service_completed_successfully

  archive-writer-scheduler:
    <<: *archive-writer
    profiles: ["archive-scheduled"]
    command:
      - sh
      - -lc
      - |
        while true; do
          if node --import tsx scripts/archive/archive-writer.ts; then
            delay="$${ARCHIVE_WRITER_INTERVAL_SECONDS:-3600}"
          else
            delay="$${ARCHIVE_SCHEDULER_FAILURE_DELAY_SECONDS:-900}"
          fi
          sleep "$${delay}"
        done
    restart: unless-stopped

  archive-verifier-scheduler:
    <<: *archive-verifier
    profiles: ["archive-scheduled"]
    command:
      - sh
      - -lc
      - |
        sleep "$${ARCHIVE_VERIFIER_INITIAL_DELAY_SECONDS:-300}"
        while true; do
          if node --import tsx scripts/archive/archive-verifier.ts; then
            delay="$${ARCHIVE_VERIFIER_INTERVAL_SECONDS:-900}"
          else
            delay="$${ARCHIVE_SCHEDULER_FAILURE_DELAY_SECONDS:-900}"
          fi
          sleep "$${delay}"
        done
    restart: unless-stopped

  wallet-evidence-materializer-scheduler:
    <<: *app
    image: ${WALLETSCANER_OPERATIONS_IMAGE:-walletscaner-worker:local}
    profiles: ["archive-scheduled"]
    command:
      - sh
      - -lc
      - |
        sleep "$${WALLET_EVIDENCE_MATERIALIZER_INITIAL_DELAY_SECONDS:-600}"
        while true; do
          if node --import tsx scripts/archive/wallet-evidence-materializer.ts; then
            delay="$${WALLET_EVIDENCE_MATERIALIZER_INTERVAL_SECONDS:-1800}"
          else
            delay="$${WALLET_EVIDENCE_MATERIALIZER_FAILURE_DELAY_SECONDS:-900}"
          fi
          sleep "$${delay}"
        done
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      ENABLE_LIVE_EXECUTION: "false"
      WALLET_EVIDENCE_MATERIALIZER_MAX_DAYS_PER_RUN: "${WALLET_EVIDENCE_MATERIALIZER_MAX_DAYS_PER_RUN:-1}"
      WALLET_EVIDENCE_MATERIALIZER_MAX_RUN_SECONDS: "${WALLET_EVIDENCE_MATERIALIZER_MAX_RUN_SECONDS:-1800}"
      WALLET_EVIDENCE_MATERIALIZER_STATEMENT_TIMEOUT_MS: "${WALLET_EVIDENCE_MATERIALIZER_STATEMENT_TIMEOUT_MS:-600000}"
      NODE_OPTIONS: "--max-old-space-size=40"
      PGOPTIONS: "-c max_parallel_workers_per_gather=0"
    restart: unless-stopped
    mem_limit: 80m
    cpus: "0.05"
    cpu_shares: 32
    pids_limit: 64
    depends_on:
      migrate:
        condition: service_completed_successfully

  archive-database-backup-writer:
    <<: *archive-writer
    profiles: ["archive-backup"]
    command: ["node", "--import", "tsx", "scripts/archive/database-backup-writer.ts"]
    volumes:
      - ./backups:/app/backups:ro
      - ./archive-staging/database-backup:/app/archive-staging

  archive-database-backup-verifier:
    <<: *archive-verifier
    profiles: ["archive-backup"]
    command: ["node", "--import", "tsx", "scripts/archive/database-backup-verifier.ts"]
    volumes:
      - ./archive-staging/database-backup:/app/archive-staging

  derived-ledger-reclaim:
    <<: *app
    image: ${WALLETSCANER_OPERATIONS_IMAGE:-walletscaner-worker:local}
    profiles: ["archive-admin"]
    command: ["node", "--import", "tsx", "scripts/maintenance/reclaim-derived-ledger-cache.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      ENABLE_LIVE_EXECUTION: "false"
      ARCHIVE_DATABASE_BACKUP_SHA256: "${ARCHIVE_DATABASE_BACKUP_SHA256:-}"
      ARCHIVE_DATABASE_BACKUP_VERIFICATION_PATH: "${ARCHIVE_DATABASE_BACKUP_VERIFICATION_PATH:-/app/archive-staging/postgres-backup-verified.json}"
      DERIVED_LEDGER_RECLAIM_APPROVAL: "${DERIVED_LEDGER_RECLAIM_APPROVAL:-}"
      NODE_OPTIONS: "--max-old-space-size=32"
      PGOPTIONS: "-c max_parallel_workers_per_gather=0"
    volumes:
      - ./archive-staging/database-backup:/app/archive-staging:ro
    init: true
    mem_limit: 64m
    cpus: "0.02"
    cpu_shares: 16
    pids_limit: 48
    depends_on:
      postgres:
        condition: service_healthy

  archive-retirement-approval:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: walletscaner-worker:local
    profiles: ["archive-admin"]
    command: ["node", "--import", "tsx", "scripts/archive/approve-future-canary.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      ENABLE_LIVE_EXECUTION: "false"
      ARCHIVE_FUTURE_CANARY_DAY: "${ARCHIVE_FUTURE_CANARY_DAY:-}"
      ARCHIVE_RETIREMENT_APPROVAL: "${ARCHIVE_RETIREMENT_APPROVAL:-}"
      ARCHIVE_OBJECT_LOCK_MIN_REMAINING_DAYS: "${ARCHIVE_OBJECT_LOCK_MIN_REMAINING_DAYS:-7}"
      NODE_OPTIONS: "--max-old-space-size=32"
      PGOPTIONS: "-c max_parallel_workers_per_gather=0"
    init: true
    mem_limit: 64m
    cpus: "0.02"
    cpu_shares: 16
    pids_limit: 48
    logging: *json-logging
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres-backup:
    image: postgres:16-alpine
    profiles: ["operations"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_BACKUP_INITIAL_DELAY_SECONDS: ${POSTGRES_BACKUP_INITIAL_DELAY_SECONDS:-86400}
      POSTGRES_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-2}
      POSTGRES_BACKUP_REQUIRE_OFFSITE_ACK: ${POSTGRES_BACKUP_REQUIRE_OFFSITE_ACK:-true}
      POSTGRES_BACKUP_MIN_FREE_BYTES: ${POSTGRES_BACKUP_MIN_FREE_BYTES:-2147483648}
    volumes:
      - ./backups:/backups
    mem_limit: 96m
    cpus: "0.04"
    cpu_shares: 64
    pids_limit: 64
    logging: *json-logging
    command:
      - sh
      - -ec
      - |
        sleep "$${POSTGRES_BACKUP_INITIAL_DELAY_SECONDS:-86400}"
        sleep_until_next_cycle() {
          interval="$${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}"
          now=$$(date +%s)
          elapsed=$$((now - cycle_started_at))
          remaining=$$((interval - elapsed))
          if [ "$${remaining}" -lt 60 ]; then
            remaining=60
          fi
          echo "backup scheduler: next cycle in $${remaining}s"
          sleep "$${remaining}"
        }
        while true; do
          cycle_started_at=$$(date +%s)
          # Interrupted dumps are not recovery artifacts. Remove only stale
          # temporary files so restarts cannot consume the fixed disk forever.
          find /backups -maxdepth 1 -type f \
            -name 'memecoin_alpha_*.dump.tmp' \
            -mmin +360 -delete
          fresh_tmp=$$(find /backups -maxdepth 1 -type f \
            -name 'memecoin_alpha_*.dump.tmp' \
            -mmin -360 -print -quit)
          if [ -n "$${fresh_tmp}" ]; then
            echo "backup skipped: a recent interrupted generation is inside its safety window"
            sleep_until_next_cycle
            continue
          fi

          # Fail closed on off-host verification without accumulating an
          # unbounded queue of completed multi-gigabyte dumps.
          unacknowledged=""
          if [ "$${POSTGRES_BACKUP_REQUIRE_OFFSITE_ACK:-true}" = "true" ]; then
            for dump in /backups/memecoin_alpha_*.dump; do
              [ -e "$${dump}" ] || continue
              sidecar="$${dump}.sha256"
              marker="$${dump}.offsite-verified"
              [ -f "$${sidecar}" ] || {
                unacknowledged="$${dump}"
                break
              }
              [ -f "$${marker}" ] || {
                unacknowledged="$${dump}"
                break
              }
              expected=$$(cut -d ' ' -f 1 "$${sidecar}")
              acknowledged=$$(sed -n 's/^sha256=//p' "$${marker}" | head -n 1)
              [ -n "$${expected}" ] && [ "$${expected}" = "$${acknowledged}" ] || {
                unacknowledged="$${dump}"
                break
              }
            done
          fi
          if [ -n "$${unacknowledged}" ]; then
            echo "backup skipped: one completed generation still awaits off-host verification"
            sleep_until_next_cycle
            continue
          fi

          # All completed generations are off-host verified at this point.
          # Keep the newest server recovery point, but remove older verified
          # copies before allocating another multi-gigabyte temporary dump.
          newest=""
          if [ "$${POSTGRES_BACKUP_REQUIRE_OFFSITE_ACK:-true}" = "true" ]; then
            for dump in $$(ls -1t /backups/memecoin_alpha_*.dump 2>/dev/null || true); do
              if [ -z "$${newest}" ]; then
                newest="$${dump}"
                continue
              fi
              rm -f -- "$${dump}" "$${dump}.sha256" "$${dump}.offsite-verified"
            done
          fi

          # Reserve enough room for a dump as large as the newest generation
          # plus a fixed emergency margin. If capacity is uncertain, fail
          # closed and preserve the existing verified server recovery point.
          previous_size=0
          if [ -n "$${newest}" ] && [ -f "$${newest}" ]; then
            previous_size=$$(stat -c '%s' "$${newest}")
          fi
          available=$$(df -PB1 /backups | awk 'NR == 2 { print $$4 }')
          minimum_free="$${POSTGRES_BACKUP_MIN_FREE_BYTES:-2147483648}"
          required=$$((previous_size + minimum_free))
          if [ -z "$${available}" ] || [ "$${available}" -lt "$${required}" ]; then
            echo "backup skipped: insufficient free space for a bounded generation"
            sleep_until_next_cycle
            continue
          fi

          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          tmp="/backups/memecoin_alpha_$${stamp}.dump.tmp"
          final="/backups/memecoin_alpha_$${stamp}.dump"
          pg_dump -h postgres -U postgres -d "$${POSTGRES_DB}" -Fc \
            --compress=zstd:1 --no-owner --no-acl -f "$${tmp}"
          pg_restore --list "$${tmp}" >/dev/null
          mv "$${tmp}" "$${final}"
          sha256sum "$${final}" > "$${final}.sha256"
          if [ "$${POSTGRES_BACKUP_REQUIRE_OFFSITE_ACK:-true}" = "true" ]; then
            find /backups -maxdepth 1 -type f \
              -name 'memecoin_alpha_*.dump.offsite-verified' \
              -mtime +"$${POSTGRES_BACKUP_RETENTION_DAYS:-3}" -print |
            while IFS= read -r marker; do
              dump="$${marker%.offsite-verified}"
              sidecar="$${dump}.sha256"
              [ -f "$${dump}" ] || continue
              [ -f "$${sidecar}" ] || continue
              expected=$$(cut -d ' ' -f 1 "$${sidecar}")
              acknowledged=$$(sed -n 's/^sha256=//p' "$${marker}" | head -n 1)
              [ -n "$${expected}" ] || continue
              [ "$${expected}" = "$${acknowledged}" ] || continue
              rm -f -- "$${dump}" "$${sidecar}" "$${marker}"
            done
          else
            find /backups -maxdepth 1 -type f \
              \( -name 'memecoin_alpha_*.dump' -o -name 'memecoin_alpha_*.dump.sha256' \) \
              -mtime +"$${POSTGRES_BACKUP_RETENTION_DAYS:-3}" -delete
          fi
          sleep_until_next_cycle
        done
    depends_on:
      postgres:
        condition: service_healthy


  market-watch:
    build:
      context: .
      dockerfile: docker/market-watch.Dockerfile
    image: walletscaner-market-watch:local
    profiles: ["legacy-research"]
    env_file:
      - .env.server
    environment:
      MARKET_WATCH_CYCLES: "0"
      MARKET_WATCH_INTERVAL_SECONDS: "90"
      MARKET_WATCH_RUN_SCAN: "true"
      MARKET_WATCH_REFRESH_TOKENS: "40"
      MARKET_WATCH_PAPER_ROUND_TRIP_COST_PCT: "3"
      MARKET_WATCH_WALLET_OUTCOME_HORIZON_MINUTES: "20"
      MARKET_WATCH_WALLET_OUTCOME_MAX_DELAY_MINUTES: "20"
      LIVE_ALPHA_MAX_CANDIDATES: "8"
      LIVE_ALPHA_TX_LIMIT_PER_PAIR: "20"
      LIVE_ALPHA_ENRICH_WALLETS: "8"
      LIVE_ALPHA_WALLET_TX_LIMIT: "12"
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    init: true
    mem_limit: 128m
    cpus: "0.05"
    cpu_shares: 64
    pids_limit: 128
    logging: *json-logging
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

